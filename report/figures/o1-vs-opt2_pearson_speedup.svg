<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #17212b; letter-spacing: 0; }
.title { font-size: 22px; font-weight: 700; }
.subtitle { font-size: 14px; fill: #586675; }
.axis { font-size: 12px; fill: #586675; }
.label { font-size: 13px; }
.value { font-size: 12px; font-weight: 700; }
</style>
<rect width="1000" height="500" fill="#ffffff"/>
<text x="32" y="34" class="title">Pearson speedup: Optimization 2 over Optimization 1</text>
<text x="32" y="56" class="subtitle">Calculated from mean elapsed time; above 1.0x is faster</text>
<line x1="89" y1="418.0" x2="930" y2="418.0" stroke="#d9e0e6"/>
<text x="81" y="422.0" text-anchor="end" class="axis">0.0</text>
<line x1="89" y1="352.4" x2="930" y2="352.4" stroke="#d9e0e6"/>
<text x="81" y="356.4" text-anchor="end" class="axis">0.3</text>
<line x1="89" y1="286.8" x2="930" y2="286.8" stroke="#d9e0e6"/>
<text x="81" y="290.8" text-anchor="end" class="axis">0.6</text>
<line x1="89" y1="221.2" x2="930" y2="221.2" stroke="#d9e0e6"/>
<text x="81" y="225.2" text-anchor="end" class="axis">0.9</text>
<line x1="89" y1="155.6" x2="930" y2="155.6" stroke="#d9e0e6"/>
<text x="81" y="159.6" text-anchor="end" class="axis">1.2</text>
<line x1="89" y1="90.0" x2="930" y2="90.0" stroke="#d9e0e6"/>
<text x="81" y="94.0" text-anchor="end" class="axis">1.5</text>
<polyline points="89.0,203.8 369.3,164.4 649.7,146.2 930.0,180.3" fill="none" stroke="#2563a6" stroke-width="4"/>
<circle cx="89.0" cy="203.8" r="6" fill="#2563a6"/>
<text x="89.0" y="191.8" text-anchor="middle" class="value">0.98x</text>
<text x="89.0" y="439" text-anchor="middle" class="label">128</text>
<circle cx="369.3" cy="164.4" r="6" fill="#2563a6"/>
<text x="369.3" y="152.4" text-anchor="middle" class="value">1.16x</text>
<text x="369.3" y="439" text-anchor="middle" class="label">256</text>
<circle cx="649.7" cy="146.2" r="6" fill="#2563a6"/>
<text x="649.7" y="134.2" text-anchor="middle" class="value">1.24x</text>
<text x="649.7" y="439" text-anchor="middle" class="label">512</text>
<circle cx="930.0" cy="180.3" r="6" fill="#2563a6"/>
<text x="930.0" y="168.3" text-anchor="middle" class="value">1.09x</text>
<text x="930.0" y="439" text-anchor="middle" class="label">1024</text>
<text x="46" y="254.0" transform="rotate(-90 46 254.0)" text-anchor="middle" class="axis">Speedup</text>
</svg>
